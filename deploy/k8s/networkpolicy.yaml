# Reference NetworkPolicy set for cloudshell session namespaces.
#
# Runtime behavior:
# - KubernetesConnector creates equivalent NetworkPolicy objects inside each
#   per-session namespace before creating the shell pod.
# - This manifest remains as an operator reference and manual bootstrap aid.
# - Do not apply this file directly to cloudshell-system expecting it to secure
#   per-session namespaces; the session namespace name is dynamic.
---
# Deny all ingress/egress for session pods by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: cloudshell-session-example
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow gateway -> session pod ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-shell
  namespace: cloudshell-session-example
spec:
  podSelector:
    matchLabels:
      cloudshell.io/managed: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudshell-system
          podSelector:
            matchLabels:
              app: cloudshell-gateway
---
# Allow limited egress from session pods: DNS and HTTPS only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-shell-egress
  namespace: cloudshell-session-example
spec:
  podSelector:
    matchLabels:
      cloudshell.io/managed: "true"
  policyTypes:
    - Egress
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # HTTPS
    - ports:
        - port: 443
          protocol: TCP
