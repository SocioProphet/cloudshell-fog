apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-managed-session-egress
spec:
  podSelector:
    matchLabels:
      cloudshell.io/managed: "true"
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-managed-session-from-same-namespace
spec:
  podSelector:
    matchLabels:
      cloudshell.io/managed: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
