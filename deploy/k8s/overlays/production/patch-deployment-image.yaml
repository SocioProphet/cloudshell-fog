apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudshell-gateway
  namespace: cloudshell-system
spec:
  template:
    spec:
      containers:
        - name: gateway
          image: ghcr.io/socioprophet/cloudshell-fog/gateway@sha256:REPLACE_WITH_REAL_DIGEST
          imagePullPolicy: IfNotPresent
          env:
            - name: RUNTIME_IMAGE_REF
              value: ghcr.io/socioprophet/cloudshell-fog/runtime@sha256:REPLACE_WITH_REAL_DIGEST
