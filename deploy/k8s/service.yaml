apiVersion: v1
kind: Service
metadata:
  name: cloudshell-gateway
  namespace: cloudshell-system
  labels:
    app: cloudshell-gateway
spec:
  selector:
    app: cloudshell-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
# Expose externally via an Ingress or LoadBalancer as needed.
