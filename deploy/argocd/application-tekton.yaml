apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudshell-tekton
spec:
  project: default
  source:
    repoURL: https://github.com/SocioProphet/cloudshell-fog
    targetRevision: main
    path: deploy/tekton
  destination:
    server: https://kubernetes.default.svc
    namespace: tekton-pipelines
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
