# Argo CD Application — auto-syncs deploy/k8s/** from the main branch.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudshell-fog
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cloudshell-fog

  source:
    repoURL: https://github.com/SocioProphet/cloudshell-fog
    targetRevision: main
    path: deploy/k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: cloudshell-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  # Require all resources to be healthy before marking the sync as complete.
  ignoreDifferences:
    - group: ""
      kind: Secret
      jsonPointers:
        - /data/session-token-signing-key
