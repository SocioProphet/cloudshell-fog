name: lattice-demo-command-bundle

on:
  pull_request:
    paths:
      - "fixtures/lattice-data-governai/demo-command-bundle.v0.1.json"
      - "tools/validate_lattice_demo_command_bundle.py"
      - ".github/workflows/lattice-demo-command-bundle.yml"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-lattice-demo-command-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Lattice demo command bundle
        run: python tools/validate_lattice_demo_command_bundle.py
