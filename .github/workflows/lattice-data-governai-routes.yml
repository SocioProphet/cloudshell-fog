name: lattice-data-governai-routes

on:
  pull_request:
    paths:
      - "fixtures/lattice-data-governai/**"
      - "tools/validate_lattice_data_governai_routes.py"
      - ".github/workflows/lattice-data-governai-routes.yml"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-lattice-data-governai-routes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Lattice Developer Home routes
        run: python tools/validate_lattice_data_governai_routes.py
