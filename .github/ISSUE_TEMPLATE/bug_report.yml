name: Bug Report
description: Report a defect or unexpected behaviour
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Run `make run-dev`
        2. POST /v1/sessions with ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go Version
      placeholder: "go version go1.22.5 linux/amd64"

  - type: input
    id: os
    attributes:
      label: Operating System / Kubernetes Version
      placeholder: "Ubuntu 22.04 / k8s 1.30"

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      render: text
