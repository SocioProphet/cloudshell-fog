apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cloudshell-verify-signed-images-keyless
  annotations:
    policies.kyverno.io/title: Verify Signed Images (Keyless)
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Verify signatures for approved cloudshell-fog images using keyless Sigstore-style attestation.
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-keyless-socioprophet-images
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/socioprophet/*"
            - "ghcr.io/socios-linux/*"
          required: true
          mutateDigest: true
          verifyDigest: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: "https://github.com/SocioProphet/cloudshell-fog/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
