<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudShell</title>
  <link rel="stylesheet" href="xterm.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1e1e1e;
      color: #ccc;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: #252526;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }

    #toolbar .title {
      font-weight: 600;
      color: #9cdcfe;
      margin-right: auto;
    }

    #status {
      font-size: 0.85em;
      color: #aaa;
    }

    button {
      padding: 4px 12px;
      border: 1px solid #555;
      border-radius: 4px;
      background: #3c3c3c;
      color: #ccc;
      cursor: pointer;
      font-size: 0.85em;
    }
    button:hover:not(:disabled) { background: #505050; }
    button:disabled { opacity: 0.4; cursor: default; }

    #terminal {
      flex: 1;
      overflow: hidden;
      padding: 4px;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <span class="title">☁ CloudShell</span>
    <span id="status">Disconnected</span>
    <button id="btn-connect">Connect</button>
    <button id="btn-terminate" disabled>Terminate</button>
  </div>
  <div id="terminal"></div>
  <script src="bundle.js"></script>
</body>
</html>
